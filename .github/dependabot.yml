# Monthly update PRs, one per ecosystem, so new library or action versions don't go unnoticed.
# Security fixes come sooner once Dependabot alerts are on (Settings > Security).
# Release labels follow AGENTS.md: app and workflow updates release as a patch (the default),
# promo-video tooling is never shipped, so it skips the release.
# cooldown: an update PR only picks versions that are at least 7 days old (Dependabot's own default is
# 3), so a poisoned release has time to be caught and pulled first (owner pick 2026-11-12).
# Security updates are not delayed.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      gradle:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /tools/promo-video
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    labels: ["release:skip"]
    groups:
      promo-video:
        patterns: ["*"]
