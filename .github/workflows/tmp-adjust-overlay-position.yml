name: Temporary overlay position refinement

on:
  push:
    branches:
      - fix/issues-25-26-movable-controls
    paths:
      - .github/workflows/tmp-adjust-overlay-position.yml

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/issues-25-26-movable-controls

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Apply requested position changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          root_path = Path("app/src/main/java/com/kienhoang/dualsubreplay/ui/LearningPlayerRoot.kt")
          root = root_path.read_text()
          root = replace_once(
              root,
              'internal const val DEFAULT_OVERLAY_VERTICAL_POSITION = 0.86f\ninternal const val DEFAULT_OVERLAY_HORIZONTAL_POSITION = 0.5f',
              'internal const val DEFAULT_OVERLAY_VERTICAL_POSITION = 0.86f\ninternal const val FULLSCREEN_LANDSCAPE_DEFAULT_OVERLAY_VERTICAL_POSITION = 0.08f\ninternal const val DEFAULT_OVERLAY_HORIZONTAL_POSITION = 0.5f',
              "fullscreen overlay default constant",
          )
          root = replace_once(
              root,
              'internal fun normalizeOverlayVerticalPosition(value: Float): Float =\n    if (value.isFinite()) value.coerceIn(0f, 1f) else DEFAULT_OVERLAY_VERTICAL_POSITION\n\n/** 0 = higher, 1 = lower. */',
              '''internal fun normalizeOverlayVerticalPosition(value: Float): Float =
    if (value.isFinite()) value.coerceIn(0f, 1f) else DEFAULT_OVERLAY_VERTICAL_POSITION

/**
 * The regular overlay keeps its lower default, while fullscreen landscape starts
 * near the top unless the user has moved it away from that default.
 */
internal fun fullscreenOverlayVerticalPosition(
    position: Float,
    orientation: Int,
): Float {
    val normalized = normalizeOverlayVerticalPosition(position)
    return if (
        orientation == Configuration.ORIENTATION_LANDSCAPE &&
        normalized == DEFAULT_OVERLAY_VERTICAL_POSITION
    ) {
        FULLSCREEN_LANDSCAPE_DEFAULT_OVERLAY_VERTICAL_POSITION
    } else {
        normalized
    }
}

/** 0 = higher, 1 = lower. */''',
              "fullscreen overlay position helper",
          )
          root = replace_once(
              root,
              'internal fun fullscreenOverlayDragTravelDp(screenHeightDp: Int): Int =\n    (screenHeightDp.coerceAtLeast(240) - FULLSCREEN_OVERLAY_ESTIMATED_HEIGHT_DP).coerceAtLeast(60)\n\ninternal fun playerControlsAvoidanceLiftDp(',
              '''internal fun fullscreenOverlayDragTravelDp(screenHeightDp: Int): Int =
    (screenHeightDp.coerceAtLeast(240) - FULLSCREEN_OVERLAY_ESTIMATED_HEIGHT_DP).coerceAtLeast(60)

internal fun fullscreenOverlayBottomPaddingWithControlsDp(
    position: Float,
    screenHeightDp: Int,
    controlsLiftDp: Int,
): Int = (fullscreenOverlayBottomPaddingDp(position, screenHeightDp) + controlsLiftDp)
    .coerceIn(0, fullscreenOverlayDragTravelDp(screenHeightDp))

internal fun playerControlsAvoidanceLiftDp(''',
              "fullscreen safe padding helper",
          )
          root = replace_once(
              root,
              '''    val bottomPadding = (overlayBottomPaddingDp(overlayVerticalPosition) + controlsLiftDp).dp
    // Fullscreen travels the whole screen so the box can sit at the very top.
    val fullscreenBottomPadding = (
        fullscreenOverlayBottomPaddingDp(
            position = overlayVerticalPosition,
            screenHeightDp = configuration.screenHeightDp,
        ) + controlsLiftDp
    ).dp
    val subtitleBoxBackgroundColor = subtitleBoxBackgroundColor(subtitleBoxBackgroundKey)''',
              '''    val bottomPadding = (overlayBottomPaddingDp(overlayVerticalPosition) + controlsLiftDp).dp
    val fullscreenVerticalPosition = fullscreenOverlayVerticalPosition(
        position = overlayVerticalPosition,
        orientation = configuration.orientation,
    )
    // Fullscreen landscape defaults close to the top and still keeps the whole box on-screen.
    val fullscreenBottomPadding = fullscreenOverlayBottomPaddingWithControlsDp(
        position = fullscreenVerticalPosition,
        screenHeightDp = configuration.screenHeightDp,
        controlsLiftDp = controlsLiftDp,
    ).dp
    val subtitleBoxBackgroundColor = subtitleBoxBackgroundColor(subtitleBoxBackgroundKey)''',
              "fullscreen overlay padding call",
          )
          root = replace_once(
              root,
              '''                MovableSubtitleFab(
                    onClick = { fullscreenOverlayHiddenByUser = false },
                    modifier = Modifier.fillMaxSize(),
                    autoDimAfterMillis = 1_000L,
                )''',
              '''                MovableSubtitleFab(
                    onClick = { fullscreenOverlayHiddenByUser = false },
                    modifier = Modifier.fillMaxSize(),
                    autoDimAfterMillis = 1_000L,
                    isFullscreen = true,
                )''',
              "fullscreen CC caller",
          )
          root = replace_once(
              root,
              '''                    content = overlayContent,
                    fontScale = state.fontScale,
                    position = overlayVerticalPosition,
                    orientation = configuration.orientation,
                    movableEnabled = movableSubtitleBox,
                    horizontalPosition = overlayHorizontalPosition,
                    isFullscreen = true,''',
              '''                    content = overlayContent,
                    fontScale = state.fontScale,
                    position = fullscreenVerticalPosition,
                    orientation = configuration.orientation,
                    movableEnabled = movableSubtitleBox,
                    horizontalPosition = overlayHorizontalPosition,
                    isFullscreen = true,''',
              "fullscreen overlay position argument",
          )
          root_path.write_text(root)

          fab_path = Path("app/src/main/java/com/kienhoang/dualsubreplay/ui/MovableSubtitleFab.kt")
          fab = fab_path.read_text()
          fab = replace_once(
              fab,
              'import android.content.SharedPreferences\n',
              'import android.content.SharedPreferences\nimport android.content.res.Configuration\n',
              "CC Configuration import",
          )
          fab = replace_once(
              fab,
              'import androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.platform.LocalDensity\n',
              'import androidx.compose.ui.platform.LocalConfiguration\nimport androidx.compose.ui.platform.LocalContext\nimport androidx.compose.ui.platform.LocalDensity\n',
              "CC LocalConfiguration import",
          )
          fab = replace_once(
              fab,
              'internal const val DEFAULT_COLLAPSED_CC_HORIZONTAL_POSITION = 1f\ninternal const val DEFAULT_COLLAPSED_CC_VERTICAL_POSITION = 1f',
              'internal const val DEFAULT_COLLAPSED_CC_HORIZONTAL_POSITION = 1f\ninternal const val DEFAULT_COLLAPSED_CC_VERTICAL_POSITION = 0.72f\ninternal const val FULLSCREEN_LANDSCAPE_DEFAULT_COLLAPSED_CC_VERTICAL_POSITION = 0.08f',
              "CC default constants",
          )
          fab = replace_once(
              fab,
              'internal fun normalizeControlPosition(value: Float, fallback: Float = 1f): Float =\n    if (value.isFinite()) value.coerceIn(0f, 1f) else fallback.coerceIn(0f, 1f)\n\ninternal fun controlOffsetPx(',
              '''internal fun normalizeControlPosition(value: Float, fallback: Float = 1f): Float =
    if (value.isFinite()) value.coerceIn(0f, 1f) else fallback.coerceIn(0f, 1f)

internal fun collapsedCcVerticalPositionForContext(
    position: Float,
    isFullscreen: Boolean,
    orientation: Int,
): Float {
    val normalized = normalizeControlPosition(position, DEFAULT_COLLAPSED_CC_VERTICAL_POSITION)
    return if (
        isFullscreen &&
        orientation == Configuration.ORIENTATION_LANDSCAPE &&
        normalized == DEFAULT_COLLAPSED_CC_VERTICAL_POSITION
    ) {
        FULLSCREEN_LANDSCAPE_DEFAULT_COLLAPSED_CC_VERTICAL_POSITION
    } else {
        normalized
    }
}

internal fun controlOffsetPx(''',
              "CC contextual default helper",
          )
          fab = replace_once(
              fab,
              '''internal fun MovableSubtitleFab(
    onClick: () -> Unit,
    modifier: Modifier = Modifier,
    autoDimAfterMillis: Long? = null,
) {
    val context = LocalContext.current
    val preferences = remember(context) {
        context.getSharedPreferences("dual_sub_preferences", 0)
    }''',
              '''internal fun MovableSubtitleFab(
    onClick: () -> Unit,
    modifier: Modifier = Modifier,
    autoDimAfterMillis: Long? = null,
    isFullscreen: Boolean = false,
) {
    val context = LocalContext.current
    val configuration = LocalConfiguration.current
    val preferences = remember(context) {
        context.getSharedPreferences("dual_sub_preferences", 0)
    }''',
              "CC fullscreen parameter",
          )
          fab = replace_once(
              fab,
              '''    var verticalPosition by remember {
        mutableFloatStateOf(
            if (rememberPosition) {
                normalizeControlPosition(
                    preferences.getFloat(
                        COLLAPSED_CC_VERTICAL_POSITION_PREFERENCE,
                        DEFAULT_COLLAPSED_CC_VERTICAL_POSITION,
                    ),
                )
            } else {
                DEFAULT_COLLAPSED_CC_VERTICAL_POSITION
            },
        )
    }''',
              '''    var verticalPosition by remember(isFullscreen, configuration.orientation) {
        mutableFloatStateOf(
            collapsedCcVerticalPositionForContext(
                position = if (rememberPosition) {
                    preferences.getFloat(
                        COLLAPSED_CC_VERTICAL_POSITION_PREFERENCE,
                        DEFAULT_COLLAPSED_CC_VERTICAL_POSITION,
                    )
                } else {
                    DEFAULT_COLLAPSED_CC_VERTICAL_POSITION
                },
                isFullscreen = isFullscreen,
                orientation = configuration.orientation,
            ),
        )
    }''',
              "CC initial vertical position",
          )
          fab = replace_once(
              fab,
              '''                    if (!rememberPosition) {
                        horizontalPosition = DEFAULT_COLLAPSED_CC_HORIZONTAL_POSITION
                        verticalPosition = DEFAULT_COLLAPSED_CC_VERTICAL_POSITION
                    }''',
              '''                    if (!rememberPosition) {
                        horizontalPosition = DEFAULT_COLLAPSED_CC_HORIZONTAL_POSITION
                        verticalPosition = collapsedCcVerticalPositionForContext(
                            position = DEFAULT_COLLAPSED_CC_VERTICAL_POSITION,
                            isFullscreen = isFullscreen,
                            orientation = configuration.orientation,
                        )
                    }''',
              "CC remember-position fallback",
          )
          fab = replace_once(
              fab,
              '''                COLLAPSED_CC_VERTICAL_POSITION_PREFERENCE -> {
                    verticalPosition = normalizeControlPosition(
                        sharedPreferences.getFloat(key, DEFAULT_COLLAPSED_CC_VERTICAL_POSITION),
                    )
                }''',
              '''                COLLAPSED_CC_VERTICAL_POSITION_PREFERENCE -> {
                    verticalPosition = collapsedCcVerticalPositionForContext(
                        position = sharedPreferences.getFloat(
                            key,
                            DEFAULT_COLLAPSED_CC_VERTICAL_POSITION,
                        ),
                        isFullscreen = isFullscreen,
                        orientation = configuration.orientation,
                    )
                }''',
              "CC stored vertical position listener",
          )
          fab = replace_once(
              fab,
              '''        preferences.registerOnSharedPreferenceChangeListener(listener)
        onDispose { preferences.unregisterOnSharedPreferenceChangeListener(listener) }
    }

    BoxWithConstraints(modifier.fillMaxSize()) {''',
              '''        preferences.registerOnSharedPreferenceChangeListener(listener)
        onDispose { preferences.unregisterOnSharedPreferenceChangeListener(listener) }
    }

    LaunchedEffect(isFullscreen, configuration.orientation, rememberPosition) {
        val storedPosition = if (rememberPosition) {
            preferences.getFloat(
                COLLAPSED_CC_VERTICAL_POSITION_PREFERENCE,
                DEFAULT_COLLAPSED_CC_VERTICAL_POSITION,
            )
        } else {
            DEFAULT_COLLAPSED_CC_VERTICAL_POSITION
        }
        verticalPosition = collapsedCcVerticalPositionForContext(
            position = storedPosition,
            isFullscreen = isFullscreen,
            orientation = configuration.orientation,
        )
    }

    BoxWithConstraints(modifier.fillMaxSize()) {''',
              "CC context resync effect",
          )
          fab_path.write_text(fab)

          root_test_path = Path("app/src/test/java/com/kienhoang/dualsubreplay/ui/LearningPlayerRootTest.kt")
          root_test = root_test_path.read_text()
          root_test = replace_once(
              root_test,
              '''    @Test
    fun fullscreenOverlayCanTravelFromTopToBottom() {''',
              '''    @Test
    fun fullscreenLandscapeStartsNearTheTopButKeepsDraggedPositions() {
        assertEquals(
            FULLSCREEN_LANDSCAPE_DEFAULT_OVERLAY_VERTICAL_POSITION,
            fullscreenOverlayVerticalPosition(
                DEFAULT_OVERLAY_VERTICAL_POSITION,
                Configuration.ORIENTATION_LANDSCAPE,
            ),
            0f,
        )
        assertEquals(
            DEFAULT_OVERLAY_VERTICAL_POSITION,
            fullscreenOverlayVerticalPosition(
                DEFAULT_OVERLAY_VERTICAL_POSITION,
                Configuration.ORIENTATION_PORTRAIT,
            ),
            0f,
        )
        assertEquals(
            0.37f,
            fullscreenOverlayVerticalPosition(0.37f, Configuration.ORIENTATION_LANDSCAPE),
            0f,
        )
        assertTrue(
            FULLSCREEN_LANDSCAPE_DEFAULT_OVERLAY_VERTICAL_POSITION <
                DEFAULT_OVERLAY_VERTICAL_POSITION,
        )
    }

    @Test
    fun fullscreenOverlayCanTravelFromTopToBottom() {''',
              "fullscreen overlay default test",
          )
          root_test = replace_once(
              root_test,
              '''        // Player-control avoidance lifts the box without going negative.
        assertTrue(fullscreenOverlayBottomPaddingDp(1f, screenHeight, PLAYER_CONTROLS_AVOIDANCE_LIFT_DP) >= 0)
    }''',
              '''        // Player-control avoidance lifts the box but clamps at the top edge.
        assertTrue(fullscreenOverlayBottomPaddingDp(1f, screenHeight, PLAYER_CONTROLS_AVOIDANCE_LIFT_DP) >= 0)
        assertEquals(
            fullscreenOverlayDragTravelDp(screenHeight),
            fullscreenOverlayBottomPaddingWithControlsDp(
                position = 0f,
                screenHeightDp = screenHeight,
                controlsLiftDp = PLAYER_CONTROLS_AVOIDANCE_LIFT_DP,
            ),
        )
    }''',
              "fullscreen safe lift test",
          )
          root_test_path.write_text(root_test)

          fab_test_path = Path("app/src/test/java/com/kienhoang/dualsubreplay/ui/MovableSubtitleFabTest.kt")
          fab_test = fab_test_path.read_text()
          fab_test = replace_once(
              fab_test,
              'package com.kienhoang.dualsubreplay.ui\n\nimport org.junit.Assert.assertEquals',
              'package com.kienhoang.dualsubreplay.ui\n\nimport android.content.res.Configuration\nimport org.junit.Assert.assertEquals\nimport org.junit.Assert.assertTrue',
              "CC test imports",
          )
          fab_test = replace_once(
              fab_test,
              '''    @Test fun offsetKeepsTheWholeControlInsideMargins() {''',
              '''    @Test fun defaultCcIsHigherAndFullscreenLandscapeStartsNearTheTop() {
        assertEquals(0.72f, DEFAULT_COLLAPSED_CC_VERTICAL_POSITION, 0f)
        assertEquals(
            FULLSCREEN_LANDSCAPE_DEFAULT_COLLAPSED_CC_VERTICAL_POSITION,
            collapsedCcVerticalPositionForContext(
                DEFAULT_COLLAPSED_CC_VERTICAL_POSITION,
                isFullscreen = true,
                orientation = Configuration.ORIENTATION_LANDSCAPE,
            ),
            0f,
        )
        assertEquals(
            DEFAULT_COLLAPSED_CC_VERTICAL_POSITION,
            collapsedCcVerticalPositionForContext(
                DEFAULT_COLLAPSED_CC_VERTICAL_POSITION,
                isFullscreen = false,
                orientation = Configuration.ORIENTATION_LANDSCAPE,
            ),
            0f,
        )
        assertEquals(
            0.44f,
            collapsedCcVerticalPositionForContext(
                0.44f,
                isFullscreen = true,
                orientation = Configuration.ORIENTATION_LANDSCAPE,
            ),
            0f,
        )
        assertTrue(
            FULLSCREEN_LANDSCAPE_DEFAULT_COLLAPSED_CC_VERTICAL_POSITION <
                DEFAULT_COLLAPSED_CC_VERTICAL_POSITION,
        )
    }

    @Test fun offsetKeepsTheWholeControlInsideMargins() {''',
              "CC contextual default test",
          )
          fab_test_path.write_text(fab_test)
          PY

      - name: Run unit tests
        run: bash ./gradlew testDebugUnitTest --stacktrace

      - name: Commit tested refinement and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-adjust-overlay-position.yml
          git add app/src/main/java/com/kienhoang/dualsubreplay/ui/LearningPlayerRoot.kt \
                  app/src/main/java/com/kienhoang/dualsubreplay/ui/MovableSubtitleFab.kt \
                  app/src/test/java/com/kienhoang/dualsubreplay/ui/LearningPlayerRootTest.kt \
                  app/src/test/java/com/kienhoang/dualsubreplay/ui/MovableSubtitleFabTest.kt
          git commit -m "Refine fullscreen overlay and CC defaults"
          git push origin HEAD:fix/issues-25-26-movable-controls
