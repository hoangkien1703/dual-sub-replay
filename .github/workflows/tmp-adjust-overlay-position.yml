name: Temporary overlay position refinement

on:
  push:
    branches:
      - fix/issues-25-26-movable-controls

permissions:
  contents: write

jobs:
  patch-test-and-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/issues-25-26-movable-controls
          fetch-depth: 0

      - name: Apply requested position changes
        run: python3 .github/scripts/tmp_adjust_overlay_position.py

      - name: Remove temporary helper files
        run: rm .github/workflows/tmp-adjust-overlay-position.yml .github/scripts/tmp_adjust_overlay_position.py

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Run unit tests
        run: bash ./gradlew testDebugUnitTest --stacktrace

      - name: Commit tested refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine fullscreen overlay and CC defaults"
          git push origin HEAD:fix/issues-25-26-movable-controls
