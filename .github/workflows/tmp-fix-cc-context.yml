name: Temporary CC context listener fix

on:
  push:
    branches:
      - fix/issues-25-26-movable-controls

permissions:
  contents: write

jobs:
  fix-test-and-commit:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/issues-25-26-movable-controls
          fetch-depth: 0

      - name: Keep preference listener synced with fullscreen context
        run: |
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/com/kienhoang/dualsubreplay/ui/MovableSubtitleFab.kt"); s=p.read_text(); old="    DisposableEffect(preferences) {"; new="    DisposableEffect(preferences, isFullscreen, configuration.orientation) {"; assert s.count(old) == 1, s.count(old); p.write_text(s.replace(old, new, 1))'
          rm .github/workflows/tmp-fix-cc-context.yml

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Run unit tests
        run: bash ./gradlew testDebugUnitTest --stacktrace

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep CC position context in sync"
          git push origin HEAD:fix/issues-25-26-movable-controls
