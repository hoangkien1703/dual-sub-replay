name: Automatic PR preview APK

on:
  workflow_run:
    workflows: ["Android build and releases"]
    # requested: publish as soon as the build job passes, while device tests still run (owner pick
    # 2026-11-11, docs/specs/2026-11-11-earlier-pr-preview.md). completed: the fallback, as before,
    # if that early run could not publish. Both jobs still gate the merge and the release.
    types: [requested, completed]
  # pull_request_target so fork PRs get a write token too; this job checks out no PR code.
  pull_request_target:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.workflow_run.id || github.event.pull_request.number || github.run_id }}
  # The run that waits for the build job and the fallback share a group: the fallback queues behind an
  # upload instead of cutting it off half-way.
  cancel-in-progress: false

jobs:
  publish-pr-preview:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.action == 'requested' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    # Most of this is waiting for the build job, which has 30 minutes itself.
    timeout-minutes: 45
    permissions:
      actions: read
      contents: write
      pull-requests: read

    steps:
      - name: Wait for the build job to pass
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_ACTION" != "requested" ]]; then
            echo "The whole CI run succeeded."
            echo "built=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A workflow cannot be started by one job of another, so this run watches the CI run it
          # was started with until verify-build ends. It reads job states only; no PR code runs here.
          deadline=$(( SECONDS + 35 * 60 ))
          while (( SECONDS < deadline )); do
            run_status="$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}" --jq '.status' || echo unknown)"
            job="$(gh api "repos/${GH_REPO}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100" \
              --jq '[.jobs[] | select(.name == "verify-build")][0] | "\(.status // "missing") \(.conclusion // "none")"' ||
              echo "unknown none")"
            if [[ "$job" == "completed success" ]]; then
              echo "verify-build passed; device tests may still be running."
              echo "built=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [[ "$job" == completed\ * ]]; then
              echo "verify-build ended as ${job#completed }; no preview for this run."
              echo "built=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # The run's state was read before the job's, so a finished run has no build job left to wait for
            # (cancelled before it started, or a fork run that still needs approval).
            if [[ "$run_status" == "completed" || "$run_status" == "action_required" ]]; then
              echo "The CI run ended without a finished verify-build job; no preview for this run."
              echo "built=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 20
          done
          echo "::warning::verify-build did not finish in 35 minutes; the preview waits for the whole CI run."
          echo "built=false" >> "$GITHUB_OUTPUT"

      - name: Verify the source PR is still open at the built commit
        id: pr
        if: steps.build.outputs.built == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          # GitHub leaves pull_requests empty for runs from forks, so find the PR by its head commit.
          if [[ -z "$PR_NUMBER" ]]; then
            matches="$(gh api --paginate "repos/${GH_REPO}/pulls?state=open&per_page=100" \
              --jq ".[] | select(.head.sha == \"${HEAD_SHA}\") | .number")"
            PR_NUMBER="${matches%%$'\n'*}"
          fi
          if [[ -z "$PR_NUMBER" ]]; then
            echo "No open PR has head ${HEAD_SHA}; skipping preview upload."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_json="$(gh api "repos/${GH_REPO}/pulls/${PR_NUMBER}")"
          state="$(jq -r '.state' <<< "$pr_json")"
          pr_head="$(jq -r '.head.sha' <<< "$pr_json")"
          head_repo="$(jq -r '.head.repo.full_name' <<< "$pr_json")"

          if [[ "$state" != "open" ]]; then
            echo "PR #$PR_NUMBER is $state; skipping stale preview upload."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$pr_head" != "$HEAD_SHA" ]]; then
            echo "PR #$PR_NUMBER moved on to $pr_head; skipping the preview of ${HEAD_SHA}."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fork PRs publish too (owner request 2026-10-28); their CI runs only once GitHub's
          # fork approval allows it, and nothing from the artifact is executed here.
          echo "PR #$PR_NUMBER comes from $head_repo."

          # The fallback has nothing to do when this build went up as soon as its build job passed.
          if [[ "$EVENT_ACTION" == "completed" ]]; then
            asset_name="DualSub-Replay-PR${PR_NUMBER}-build${BUILD_NUMBER}-preview.apk"
            assets="$(gh release view preview --json assets --jq '.assets[].name' || true)"
            if grep -Fxq "$asset_name" <<< "$assets"; then
              echo "$asset_name is already on the preview release; nothing to do."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Download the APK the build job produced
        if: steps.pr.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: DualSub-Replay-preview
          path: verified
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      # main's own patch tool, never the PR's code.
      - name: Check out the patch tool from main
        if: steps.pr.outputs.publish == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: main-tools
          sparse-checkout: tools
          persist-credentials: false

      - name: Package the versioned PR preview APK
        if: steps.pr.outputs.publish == 'true'
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail
          mkdir -p release
          asset_name="DualSub-Replay-PR${PR_NUMBER}-build${BUILD_NUMBER}-preview.apk"
          cp verified/DualSub-Replay-preview.apk "release/$asset_name"
          sha256sum "release/$asset_name"
          echo "asset_name=$asset_name" >> "$GITHUB_OUTPUT"

          # A phone with the build this one replaces downloads a small patch (owner pick 2026-11-08,
          # docs/specs/2026-11-08-smaller-app-updates.md). Best effort: without it, the whole APK.
          previous="$( (gh release view preview --json assets --jq '.assets[].name' || true) |
            sed -nE "s/^DualSub-Replay-PR${PR_NUMBER}-build([0-9]+)-preview\.apk$/\1/p" |
            awk -v build="$BUILD_NUMBER" '$1 < build' | sort -n | tail -n 1)"
          if [[ -n "$previous" ]] &&
             gh release download preview --pattern "DualSub-Replay-PR${PR_NUMBER}-build${previous}-preview.apk" --dir previous; then
            patch_name="DualSub-Replay-PR${PR_NUMBER}-build${BUILD_NUMBER}-from-build${previous}.patch"
            if python3 -I main-tools/tools/apk_patch.py make "previous/DualSub-Replay-PR${PR_NUMBER}-build${previous}-preview.apk" \
                 "release/$asset_name" "release/$patch_name"; then
              ls -l "release/$patch_name"
              echo "patch_name=$patch_name" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::No patch from build ${previous}."
            fi
          fi

      - name: Upload newest PR preview to rolling preview release
        if: steps.pr.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          ASSET_NAME: ${{ steps.package.outputs.asset_name }}
          PATCH_NAME: ${{ steps.package.outputs.patch_name }}
        run: |
          set -euo pipefail
          # The patch goes up first, so a phone that sees the new APK finds its patch too.
          if [[ -n "$PATCH_NAME" ]]; then
            gh release upload preview "release/$PATCH_NAME" --clobber
          fi
          assets="$(gh release view preview --json assets --jq '.assets[].name' || true)"
          while IFS= read -r asset; do
            [[ -z "$asset" ]] && continue
            if [[ "$asset" =~ ^DualSub-Replay-PR${PR_NUMBER}-((build[0-9]+-)?preview\.apk|build[0-9]+-from-build[0-9]+\.patch)$ ]] &&
               [[ "$asset" != "$ASSET_NAME" ]] && [[ "$asset" != "$PATCH_NAME" ]]; then
              gh release delete-asset preview "$asset" --yes
              echo "Removed older PR #$PR_NUMBER preview: $asset"
            fi
          done <<< "$assets"

          gh release upload preview "release/$ASSET_NAME" --clobber
          echo "Published $ASSET_NAME from the CI artifact of a build job that passed."

  cleanup-pr-preview:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Remove closed PR preview APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          assets="$(gh release view preview --json assets --jq '.assets[].name' || true)"
          removed=false
          while IFS= read -r asset; do
            [[ -z "$asset" ]] && continue
            if [[ "$asset" =~ ^DualSub-Replay-PR${PR_NUMBER}-((build[0-9]+-)?preview\.apk|build[0-9]+-from-build[0-9]+\.patch)$ ]]; then
              gh release delete-asset preview "$asset" --yes
              echo "Deleted $asset from the preview release."
              removed=true
            fi
          done <<< "$assets"

          if [[ "$removed" == "false" ]]; then
            echo "PR #$PR_NUMBER preview APK is already absent from the preview release."
          fi
