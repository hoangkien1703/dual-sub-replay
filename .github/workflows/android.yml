name: Android build and releases

on:
  pull_request:
    # No ready_for_review: drafts already run CI, so marking one ready would only repeat it on the same commit.
    types: [opened, synchronize, reopened]
  # setup-gradle only saves caches from the default branch, so main runs keep PR caches fresh.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android build SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # No signing key here: this job runs the PR's own code, fork PRs too, so the preview APK is
      # signed with this runner's throwaway debug key. pr-preview-auto.yml signs own-branch previews
      # with the preview key from the main-only `preview` environment (security review 2026-11-18,
      # docs/specs/2026-11-18-security-review-fixes.md). Fork builds get their own package name, so
      # they can never install over a normal preview.
      - name: Choose the preview package
        env:
          OWN_BRANCH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [[ "$OWN_BRANCH" == "true" ]]; then suffix=.preview; else suffix=.forkpreview; fi
          echo "PREVIEW_SUFFIX=$suffix" >> "$GITHUB_ENV"
          echo "Preview package: com.kienhoang.dualsubreplay$suffix"

      - name: Test release automation
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Verify Gradle wrapper
        run: bash ./gradlew --version

      - name: Test, lint, and build
        run: |
          set -euo pipefail
          preview_version_code=$(( $(date -u +%s) - 1700000000 ))
          bash ./gradlew formatCheck complexityCheck testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest \
            -PpreviewVersionCode="$preview_version_code" \
            -PpreviewVersionNameSuffix="-pr${{ github.event.pull_request.number || 'manual' }}-build${GITHUB_RUN_NUMBER}" \
            -PpreviewApplicationIdSuffix="$PREVIEW_SUFFIX" \
            --stacktrace

      - name: List failed unit tests
        if: failure()
        run: python3 tools/report_failed_tests.py app/build/test-results/ --title "Failed unit tests"

      - name: Verify preview package id
        run: |
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 1)"
          echo "$badging"
          if [[ "$badging" != *"name='com.kienhoang.dualsubreplay${PREVIEW_SUFFIX}'"* ]]; then
            echo "Preview APK does not use the isolated preview application id" >&2
            exit 1
          fi

      - name: Name preview APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DualSub-Replay-preview.apk

      - name: Upload verified preview APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DualSub-Replay-preview
          path: DualSub-Replay-preview.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build optimized release APK with test signing
        run: |
          set -euo pipefail
          bash ./gradlew assembleRelease \
            -PtestReleaseSigning=true \
            -PpreviewApplicationIdSuffix=".releasesmoke" \
            --stacktrace

      - name: Verify release APK size, permissions, and forbidden components
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Fails above the hard limit; growth since the last release only warns
          # (docs/specs/2026-11-15-ai-request-and-size-checks.md). Raise the limit on purpose when a feature needs it.
          baseline=()
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
            --jq '[.tag_name, (.assets[] | select(.name == "DualSub-Replay.apk") | .size | tostring)] | join(" ")' 2>/dev/null || true)
          read -r tag size <<< "$latest" || true
          if [[ -n "${size:-}" ]]; then
            baseline=(--baseline-bytes "$size" --baseline-label "$tag")
          else
            echo "No published release APK to compare with."
          fi
          python3 tools/report_apk.py app/build/outputs/apk/release/app-release.apk \
            --max-bytes 32000000 \
            --stretch-bytes 28000000 \
            --warn-growth-bytes 500000 \
            --summary "$GITHUB_STEP_SUMMARY" \
            --output-json apk-size-report.json \
            "${baseline[@]}"

      - name: Upload size report and R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-size-and-r8-mapping
          path: |
            apk-size-report.json
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 14

      # The Google Play build (docs/specs/2026-11-21-google-play-build.md): an unsigned App Bundle, so a
      # change that breaks it fails here, and its manifest must not ask for what Play forbids.
      - name: Build the Google Play bundle and check its manifest
        run: |
          set -euo pipefail
          bash ./gradlew bundlePlay --stacktrace
          python3 tools/check_play_manifest.py \
            app/build/intermediates/merged_manifest/play/processPlayMainManifest/AndroidManifest.xml

      - name: Upload the unsigned Google Play bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DualSub-Replay-play-bundle
          path: app/build/outputs/bundle/play/app-play.aab
          if-no-files-found: error
          retention-days: 7

  managed-device-tests:
    runs-on: ubuntu-latest
    # Room for one full retry when the emulator crashes a run.
    timeout-minutes: 75
    permissions:
      contents: read
      # Reads main's last memory report to compare with (report only).
      actions: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install API 36 managed-device image
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0" "emulator" "system-images;android-36;default;x86_64"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run offline WebView fixture tests on API 36
        id: device_tests
        continue-on-error: true
        run: >-
          bash ./gradlew pixel2Api36DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --no-parallel --max-workers=2 --stacktrace

      - name: Run failed device tests once more
        if: steps.device_tests.outcome == 'failure'
        run: |
          # The hosted emulator sometimes fails a test that passes on the same code (main, 2026-11-15:
          # three tries, three different tests). Failed tests run once more; failing twice fails the job,
          # and tests that pass on retry are listed as warnings so flakes stay visible.
          results=app/build/outputs/androidTest-results/managedDevice
          first_try=app/build/outputs/androidTest-results/managedDevice-first-try
          retry=app/build/outputs/androidTest-results/managedDevice-retry
          plan=$(python3 tools/retry_device_tests.py "$results/")
          echo "Retry: $plan"
          if [[ "$plan" == none ]]; then
            echo "::error title=Device tests::The run failed without a failed test (build or emulator start), so it is not retried."
            exit 1
          fi
          mv "$results" "$first_try"
          args=()
          if [[ "$plan" != all ]]; then args=("-Pandroid.testInstrumentationRunnerArguments.class=$plan"); fi
          status=0
          bash ./gradlew pixel2Api36DebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            --no-parallel --max-workers=2 --stacktrace "${args[@]}" || status=$?
          if [[ "$plan" != all ]]; then
            # The first try ran every test, so the CPU and memory reports keep reading it.
            if [[ -d "$results" ]]; then mv "$results" "$retry"; else mkdir -p "$retry"; fi
            mv "$first_try" "$results"
            flaky="$results/"
          else
            flaky="$first_try/"
          fi
          if [[ $status -eq 0 ]]; then
            python3 tools/report_failed_tests.py "$flaky" --flaky --title "Device tests that failed once, then passed on retry"
          fi
          exit "$status"

      - name: Report page CPU use
        if: always()
        run: |
          # PageCpuUseTest logs CPU milliseconds a second per scenario (docs/specs/2026-10-22-lighter-cpu-use.md).
          lines=$(grep -rahoE "scenario=[a-z0-9_]+ app_ms_per_s=[0-9.]+ page_ms_per_s=[0-9.]+ total_ms_per_s=[0-9.]+( page_process=unreadable)?" \
            app/build/outputs/androidTest-results/managedDevice/ 2>/dev/null | sort -u || true)
          echo "${lines:-No PageCpuUseTest results found.}"
          { echo "### Page CPU use (ms of CPU per second)"; echo '```'; echo "${lines:-No results found.}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Report memory and storage use
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Report only, never fails (docs/specs/2026-11-15-ai-request-and-size-checks.md): compares with main's last green run.
          baseline=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android.yml --branch main --event push \
              --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty' 2>/dev/null || true)
            if [[ -n "$run_id" ]] && gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name memory-use --dir memory-baseline; then
              baseline=(--baseline memory-baseline/memory-use.json --baseline-label "main")
            fi
          fi
          python3 tools/report_memory.py app/build/outputs/androidTest-results/managedDevice/ \
            --output-json memory-use.json --summary "$GITHUB_STEP_SUMMARY" "${baseline[@]}"

      - name: Upload memory use
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-use
          path: memory-use.json
          if-no-files-found: ignore
          retention-days: 30

      - name: List failed device tests
        if: failure()
        run: |
          # After a retry of some tests, their second results are what failed the job.
          results=app/build/outputs/androidTest-results/managedDevice-retry/
          [[ -d "$results" ]] || results=app/build/outputs/androidTest-results/managedDevice/
          python3 tools/report_failed_tests.py "$results" --title "Failed device tests"

      - name: Upload managed-device reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pixel2-api36-test-reports
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
