name: Android build and preview APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Restore persistent preview signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: dual-sub-replay-preview-signing-v1

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 9.5.0

      - name: Test, lint, and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Name preview APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DualSub-Replay-v0.2.0-preview.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualSub-Replay-v0.2.0-preview
          path: DualSub-Replay-v0.2.0-preview.apk
          if-no-files-found: error

      - name: Remove obsolete preview APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete-asset preview DualSub-Replay-v0.1.1-preview.apk --yes

      - name: Publish rolling preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          name: DualSub Replay preview
          prerelease: true
          make_latest: false
          body: |
            Automated preview build from the latest verified `main` commit.

            This APK uses a CI debug signature. Uninstall an older preview first if Android reports a signature mismatch.
          files: DualSub-Replay-v0.2.0-preview.apk
          overwrite_files: true
