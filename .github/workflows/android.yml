name: Android build and releases

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # setup-gradle only saves caches from the default branch, so main runs keep PR caches fresh.
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android build SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Restore persistent preview signing key
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.android/debug.keystore
          key: dual-sub-replay-preview-signing-v1

      - name: Test release automation
        run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v

      - name: Verify Gradle wrapper
        run: bash ./gradlew --version

      - name: Test, lint, and build
        run: |
          set -euo pipefail
          preview_version_code=$(( $(date -u +%s) - 1700000000 ))
          bash ./gradlew formatCheck complexityCheck testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest \
            -PpreviewVersionCode="$preview_version_code" \
            -PpreviewVersionNameSuffix="-pr${{ github.event.pull_request.number || 'manual' }}-build${GITHUB_RUN_NUMBER}" \
            -PpreviewApplicationIdSuffix=".preview" \
            --stacktrace

      - name: Verify preview package id
        run: |
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 1)"
          echo "$badging"
          if [[ "$badging" != *"name='com.kienhoang.dualsubreplay.preview'"* ]]; then
            echo "Preview APK does not use the isolated preview application id" >&2
            exit 1
          fi

      - name: Name preview APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DualSub-Replay-preview.apk

      - name: Upload verified preview APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: DualSub-Replay-preview
          path: DualSub-Replay-preview.apk
          if-no-files-found: error
          retention-days: 7

      - name: Build optimized release APK with test signing
        run: |
          set -euo pipefail
          bash ./gradlew assembleRelease \
            -PtestReleaseSigning=true \
            -PpreviewApplicationIdSuffix=".releasesmoke" \
            --stacktrace

      - name: Verify release APK size, permissions, and forbidden components
        run: |
          python3 tools/report_apk.py app/build/outputs/apk/release/app-release.apk \
            --max-bytes 80000000 \
            --stretch-bytes 40000000 \
            --output-json apk-size-report.json

      - name: Upload size report and R8 mapping
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-size-and-r8-mapping
          path: |
            apk-size-report.json
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn
          retention-days: 14

  managed-device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install API 36 managed-device image
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "emulator" "system-images;android-36;default;x86_64"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Run offline WebView fixture tests on API 36
        run: >-
          bash ./gradlew pixel2Api36DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          --no-parallel --max-workers=2 --stacktrace

      - name: Report page CPU use
        if: always()
        run: |
          # PageCpuUseTest logs CPU milliseconds a second per scenario (docs/specs/2026-10-22-lighter-cpu-use.md).
          lines=$(grep -rahoE "scenario=[a-z_]+ app_ms_per_s=[0-9.]+ page_ms_per_s=[0-9.]+ total_ms_per_s=[0-9.]+( page_process=unreadable)?" \
            app/build/outputs/androidTest-results/managedDevice/ 2>/dev/null | sort -u || true)
          echo "${lines:-No PageCpuUseTest results found.}"
          { echo "### Page CPU use (ms of CPU per second)"; echo '```'; echo "${lines:-No results found.}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload managed-device reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pixel2-api36-test-reports
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
          if-no-files-found: warn
