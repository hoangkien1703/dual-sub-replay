name: Release v0.9.4 once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Release v0.9.4'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android build SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d

      - name: Verify release version
        run: |
          app_version="$(sed -n 's/^val appVersionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ "$app_version" != "0.9.4" ]; then
            echo "Expected app version 0.9.4, got $app_version" >&2
            exit 1
          fi

      - name: Test and lint
        run: bash ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Restore production signing key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" ]; then
            echo "ANDROID_RELEASE_KEYSTORE_BASE64 is not configured" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dual-sub-replay-release.jks"
          chmod 600 "$RUNNER_TEMP/dual-sub-replay-release.jks"

      - name: Build production release APK
        env:
          ANDROID_RELEASE_STORE_FILE: ${{ runner.temp }}/dual-sub-replay-release.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease -PrequireReleaseSigning=true --stacktrace

      - name: Verify and package official APK
        run: |
          source_apk="app/build/outputs/apk/release/app-release.apk"
          release_apk="release/DualSub-Replay.apk"
          mkdir -p release
          cp "$source_apk" "$release_apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$release_apk" | tee release/signing-report.txt
          if grep -q 'CN=Android Debug' release/signing-report.txt; then
            echo "Official APK was signed with the Android debug certificate" >&2
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$release_apk" | head -n 1
          sha256sum "$release_apk" | sed 's#  release/#  #' > release/DualSub-Replay.apk.sha256

      - name: Publish official GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: v0.9.4
          target_commitish: ${{ github.sha }}
          name: DualSub Replay v0.9.4
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            ## Download and install

            Download **DualSub-Replay.apk** below. Preview builds install separately as **DualSub Replay Preview**, so you can install this official build normally without removing the preview app.

            ## v0.9.4 highlights

            - Improves karaoke highlighting for YouTube auto-generated captions by preserving real word-level timing anchors and expanding multi-word ASR chunks into individual timed words.
            - Keeps accurate word timings even when a neighboring auto-caption cue is malformed or missing timing, estimating only the affected cue instead of the whole subtitle segment.
            - Changes the active karaoke word to highlight color + underline only, removing bold text so surrounding words no longer shift while highlighting.
            - Adds regression coverage for auto-caption timing and the non-bold underline highlight style.

            The `.sha256` file can be used to verify the APK download.
          files: |
            release/DualSub-Replay.apk
            release/DualSub-Replay.apk.sha256
