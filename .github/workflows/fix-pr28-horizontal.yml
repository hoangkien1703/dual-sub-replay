name: Fix PR28 horizontal drag

on:
  push:
    branches:
      - fix/issues-25-26-movable-controls

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/issues-25-26-movable-controls
          fetch-depth: 0

      - name: Apply horizontal drag fix
        run: python3 .github/scripts/fix_pr28_horizontal.py

      - name: Remove one-shot helper files
        run: rm .github/workflows/fix-pr28-horizontal.yml .github/scripts/fix_pr28_horizontal.py

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify unit tests
        run: bash ./gradlew testDebugUnitTest --stacktrace

      - name: Commit verified fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Match overlay drag speed to finger movement"
          git push origin HEAD:fix/issues-25-26-movable-controls
