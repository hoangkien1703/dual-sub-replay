name: Promote v0.3.1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/promote-v0.3.1.yml

permissions:
  contents: write

jobs:
  publish-official-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out verified v0.3.1 source
        uses: actions/checkout@v4
        with:
          ref: c4eb6b2d3cae33440f1487968c741035b4f9642e

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore production signing key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dual-sub-replay-release.jks"
          chmod 600 "$RUNNER_TEMP/dual-sub-replay-release.jks"

      - name: Build production release APK
        env:
          ANDROID_RELEASE_STORE_FILE: ${{ runner.temp }}/dual-sub-replay-release.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease -PrequireReleaseSigning=true --stacktrace

      - name: Verify and package official APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/DualSub-Replay.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs release/DualSub-Replay.apk | tee release/signing-report.txt
          if grep -q 'CN=Android Debug' release/signing-report.txt; then
            exit 1
          fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging release/DualSub-Replay.apk | head -n 1
          sha256sum release/DualSub-Replay.apk | sed 's#  release/#  #' > release/DualSub-Replay.apk.sha256

      - name: Publish official v0.3.1 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.1
          target_commitish: c4eb6b2d3cae33440f1487968c741035b4f9642e
          name: DualSub Replay v0.3.1
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          body: |
            ## Download and install

            Download **DualSub-Replay.apk** below. On Android 8.0 or newer, open the downloaded file and allow your browser or file manager to install unknown apps if Android asks.

            **Preview users:** uninstall the preview build once before installing this official release because the official app uses the production signing key.

            ## Highlights

            - Choose available caption languages and translate into any language supported by Google ML Kit.
            - Download only the translation models needed for the selected languages.
            - Tap a subtitle paragraph to replay that moment.
            - Swipe down to hide the subtitle panel temporarily.
            - Continue using the same YouTube page for controls, comments, and recommendations.

            The `.sha256` file can be used to verify the APK download.
          files: |
            release/DualSub-Replay.apk
            release/DualSub-Replay.apk.sha256
