name: Apply PR17 overlay refinements

on:
  push:
    branches:
      - feature/scroll-friendly-learning-overlay
    paths:
      - .github/workflows/pr17-refinement.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/scroll-friendly-learning-overlay
          fetch-depth: 0

      - name: Apply unified settings and draggable overlay refinements
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          root_path = Path("app/src/main/java/com/kienhoang/dualsubreplay/ui/LearningPlayerRoot.kt")
          root_path.write_text(r'''package com.kienhoang.dualsubreplay.ui

