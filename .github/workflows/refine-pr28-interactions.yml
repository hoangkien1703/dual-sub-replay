name: Refine PR28 interactions

on:
  push:
    branches: [fix/issues-25-26-movable-controls]

permissions:
  contents: write

jobs:
  refine-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/issues-25-26-movable-controls
          fetch-depth: 0

      - name: Apply interaction refinements
        shell: bash
        run: |
          cat > /tmp/refine.b64 <<'B64'
'''''')
B64
          base64 -d /tmp/refine.b64 > /tmp/refine.py
          python3 /tmp/refine.py

      - name: Remove one-shot workflow from final commit
        run: rm .github/workflows/refine-pr28-interactions.yml

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Verify interaction changes
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Commit verified changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine fullscreen subtitle interactions"
          git push origin HEAD:fix/issues-25-26-movable-controls
