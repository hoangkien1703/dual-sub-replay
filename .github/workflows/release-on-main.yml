name: Release merged PR

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Merged PR number to retry (uses its reserved version if one exists)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false
  queue: max

jobs:
  prepare:
    if: github.repository == 'hoangkien1703/dual-sub-replay' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      pull-requests: read
      issues: write # Create the optional release labels on first use.
    outputs:
      eligible: ${{ steps.plan.outputs.eligible }}
      release_needed: ${{ steps.plan.outputs.release_needed }}
      release_id: ${{ steps.plan.outputs.release_id }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      version: ${{ steps.plan.outputs.version }}
      version_code: ${{ steps.plan.outputs.version_code }}
    steps:
      - name: Check out trusted main workflow source and release history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure optional release labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          labels="$(gh label list --limit 1000 --json name --jq '.[].name')"
          for mode in patch minor major skip; do
            label="release:$mode"
            if ! grep -Fxq "$label" <<< "$labels"; then
              gh label create "$label" --color 1D76DB --description "Release automation: $mode"
            fi
          done

      - name: Verify merge and CI, then reserve or resume the release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.pr_number }}
        run: python3 tools/automatic_release.py prepare

  publish-main:
    needs: prepare
    # release:skip merges publish nothing (owner decision 2026-10-18: no rolling main preview APK).
    if: needs.prepare.outputs.eligible == 'true' && needs.prepare.outputs.release_needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Skip a release already published by an earlier attempt
        id: resume
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_ID" ]]; then
            draft="$(gh api "repos/${GH_REPO}/releases/${RELEASE_ID}" --jq '.draft')"
            if [[ "$draft" == "false" ]]; then
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "Release is already public; skipping all builds and uploads."
              exit 0
            fi
            [[ "$draft" == "true" ]] || exit 1
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"

      - name: Check out the exact reserved release source
        if: steps.resume.outputs.build == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          persist-credentials: false

      - name: Set up Java 17
        if: steps.resume.outputs.build == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        if: steps.resume.outputs.build == 'true'
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android build SDK
        if: steps.resume.outputs.build == 'true'
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        if: steps.resume.outputs.build == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Restore production signing key
        if: steps.resume.outputs.build == 'true'
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" ]]; then
            echo "ANDROID_RELEASE_KEYSTORE_BASE64 is not configured" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dual-sub-replay-release.jks"
          chmod 600 "$RUNNER_TEMP/dual-sub-replay-release.jks"

      - name: Build production release APK
        if: steps.resume.outputs.build == 'true'
        env:
          ANDROID_RELEASE_STORE_FILE: ${{ runner.temp }}/dual-sub-replay-release.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: bash ./gradlew assembleRelease -PrequireReleaseSigning=true --stacktrace

      - name: Verify and package official APK
        if: steps.resume.outputs.build == 'true'
        env:
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          set -euo pipefail
          mkdir -p release
          source_apk="app/build/outputs/apk/release/app-release.apk"
          release_apk="release/DualSub-Replay.apk"
          cp "$source_apk" "$release_apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$release_apk" | tee release/signing-report.txt
          if grep -q 'CN=Android Debug' release/signing-report.txt; then
            echo "Official APK was signed with the Android debug certificate" >&2
            exit 1
          fi
          badging="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$release_apk" | head -n 1)"
          echo "$badging"
          if [[ "$badging" != *"name='com.kienhoang.dualsubreplay'"* ]] ||
             [[ "$badging" != *"versionName='$EXPECTED_VERSION'"* ]] ||
             [[ "$badging" != *"versionCode='$EXPECTED_CODE'"* ]]; then
            echo "Official APK package/version differs from the release reservation" >&2
            exit 1
          fi
          sha256sum "$release_apk" | sed 's#  release/#  #' > release/DualSub-Replay.apk.sha256

      - name: Upload verified APK and checksum to the reserved draft
        if: steps.resume.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: >-
          gh release upload "v${RELEASE_VERSION}"
          release/DualSub-Replay.apk release/DualSub-Replay.apk.sha256 --clobber

      - name: Publish the complete official release
        if: steps.resume.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: python3 tools/automatic_release.py publish --release-id "$RELEASE_ID"

      - name: Remove production signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/dual-sub-replay-release.jks"
