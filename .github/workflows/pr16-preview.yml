name: PR 16 preview APK

on:
  push:
    branches:
      - feature/immersive-resizable-landscape

permissions:
  contents: write

jobs:
  publish-pr-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Restore persistent preview signing key
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.android/debug.keystore
          key: dual-sub-replay-preview-signing-v1

      - name: Build PR preview APK
        run: bash ./gradlew assembleDebug --stacktrace

      - name: Package PR preview APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/DualSub-Replay-PR16-preview.apk
          sha256sum release/DualSub-Replay-PR16-preview.apk

      - name: Upload PR preview to rolling preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload preview release/DualSub-Replay-PR16-preview.apk --clobber
