name: Integrate option 5 acoustic alignment once

on:
  push:
    branches: [fix/karaoke-preserve-word-timing]
    paths: [".github/workflows/apply-option5-once.yml"]

permissions:
  contents: write

jobs:
  integrate-verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/karaoke-preserve-word-timing
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Recover and apply option 5 integration
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import gzip
          import re
          import subprocess
          from pathlib import Path

          previous = subprocess.check_output(
              [
                  "git",
                  "show",
                  "4cc248f15d8538032393839b871e2619c0595366:.github/workflows/apply-option5-once.yml",
              ],
              text=True,
          )
          match = re.search(r'payload = "([A-Za-z0-9+/=]+)"', previous)
          if not match:
              raise RuntimeError("Could not recover the option 5 integration payload.")

          script = gzip.decompress(base64.b64decode(match.group(1))).decode("utf-8")
          anchor = "ICAgICAgICAgICAgICAgICAgICBsYXRlc3RZb3VUdWJlQ2FwdGlvbk9ic2VydmF0aW9uID0gbnVsbAo="
          lines = script.splitlines()
          patched = 0
          for index, line in enumerate(lines):
              if anchor in line and line.rstrip().endswith(", 2)"):
                  lines[index] = line.rsplit(", 2)", 1)[0] + ", 1)"
                  patched += 1
          if patched != 1:
              raise RuntimeError(f"Expected to patch one reset assertion, patched {patched}.")

          Path("/tmp/integrate_option5.py").write_text("\n".join(lines) + "\n")
          PY
          python3 /tmp/integrate_option5.py

      - name: Verify
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest

      - name: Commit verified integration
        shell: bash
        run: |
          rm .github/workflows/apply-option5-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git status --short
          git commit -m "Integrate option 5 acoustic forced alignment"
          git push origin HEAD:fix/karaoke-preserve-word-timing
