name: Run PR17 refinement patch

on:
  push:
    branches:
      - feature/scroll-friendly-learning-overlay
    paths:
      - .github/workflows/pr17-refinement-runner.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/scroll-friendly-learning-overlay
          fetch-depth: 0

      - name: Extract and run refinement script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/pr17-refinement.yml').read_text(encoding='utf-8')
          start = source.index('          from pathlib import Path')
          end = source.index('\n      - name: Commit refinements', start)
          block = source[start:end]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          script = '\n'.join(lines) + '\n'
          Path('/tmp/pr17_refinement.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/pr17_refinement.py

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/kienhoang/dualsubreplay/ui/LearningPlayerRoot.kt \
                  app/src/main/java/com/kienhoang/dualsubreplay/ui/YouTubeBrowserScreen.kt \
                  app/src/main/java/com/kienhoang/dualsubreplay/ui/DualSubApp.kt \
                  app/src/test/java/com/kienhoang/dualsubreplay/ui/LearningPlayerRootTest.kt \
                  app/src/test/java/com/kienhoang/dualsubreplay/ui/PlaybackArchitectureTest.kt \
                  app/src/androidTest/java/com/kienhoang/dualsubreplay/ui/LearningPlayerUiTest.kt
          git diff --cached --check
          git commit -m "Unify settings and make overlay draggable"
          git push origin HEAD:feature/scroll-friendly-learning-overlay
