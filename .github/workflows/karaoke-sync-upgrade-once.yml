name: Apply karaoke sync upgrade once

on:
  push:
    branches: [fix/karaoke-preserve-word-timing]
    paths: [".github/workflows/karaoke-sync-upgrade-once.yml"]

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/karaoke-preserve-word-timing
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android build SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Decode and apply options 1-4
        shell: bash
        run: |
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/apply-karaoke-sync.py
          python /tmp/apply-karaoke-sync.py

      - name: Test, lint, and build
        run: |
          set -euo pipefail
          bash ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Commit verified upgrade
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "No code changes to commit"
            exit 1
          fi
          git commit -m "Upgrade karaoke sync with frame clock and DOM hints"
          git push origin HEAD:fix/karaoke-preserve-word-timing
