# Paths GitHub secret scanning (and push protection) skips. Nothing here is a real secret:
# - The tests use made-up keys (AIza-FAKE…, sk-proj-…, tvly-dev-…) to check key detection and storage.
# - The two app files hold YouTube's own public web keys, which every youtube.com page sends to
#   every visitor; the app reuses them exactly as YouTube's web player does.
# Keep this list to files that need it: a real key in an ignored path would not be reported.
paths-ignore:
  - "app/src/test/**"
  - "app/src/androidTest/**"
  - "app/src/main/java/com/kienhoang/dualsubreplay/data/YouTubeCaptionProvider.kt"
  - "app/src/main/java/com/kienhoang/dualsubreplay/ui/PageTokenScript.kt"
